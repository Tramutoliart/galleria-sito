<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleria d'arte Tramutoli - Sito in aggiornamento</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #111;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .container {
      max-width: 600px;
      border: 1px solid #333;
      padding: 48px 32px;
      background-color: #181818;
      border-radius: 4px;
    }
    h1 {
      font-size: 1.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 300;
      margin-bottom: 20px;
    }
    p {
      color: #aaa;
      line-height: 1.6;
      margin-bottom: 24px;
      font-size: 1rem;
    }
    .contact-link {
      display: inline-block;
      color: #fff;
      text-decoration: none;
      border-bottom: 1px solid #fff;
      padding-bottom: 2px;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Galleria d'arte Tramutoli</h1>
    <p>Stiamo rinnovando la nostra presenza online per la nuova stagione espositiva.<br>A breve sarà disponibile il nuovo catalogo delle opere.</p>
    <p>Per informazioni sulle opere, visite e contatti diretti:<br>
      <a class="contact-link" href="mailto:info@iltuodominio.it">Tramutoli.artgallery@gmail.com</a>
    </p>
  </div>
</body>
</html>
